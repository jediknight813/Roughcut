[package]
name = "quill-import"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "0.8.44"
pulldown-cmark = { version = "0.13.6", default-features = false }
quick-xml = "0.42.0"
quill-doc = { version = "0.1.0", path = "../quill-doc" }
scraper = { version = "0.29.0", default-features = false }
thiserror = "2.0.21"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
